<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지하철 보채기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e4e2dc;
  --free:#cfe3d4; --prep:#f2b950; --travel:#3f7fd9; --late:#d9534f; --ok:#2f8f5b;
  --chip:#efeee9; --me:#1d1d1b; --meInk:#f6f5f1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --card:#1f1f1d; --ink:#f1f0ea; --muted:#a3a29c; --line:#34332f;
    --free:#2a3b2f; --prep:#e0a63c; --travel:#5b95e8; --late:#ef6b66; --ok:#4cb37b;
    --chip:#2a2a27; --me:#f1f0ea; --meInk:#141413;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1f1f1d; --ink:#f1f0ea; --muted:#a3a29c; --line:#34332f;
  --free:#2a3b2f; --prep:#e0a63c; --travel:#5b95e8; --late:#ef6b66; --ok:#4cb37b;
  --chip:#2a2a27; --me:#f1f0ea; --meInk:#141413;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:18px;margin:0;font-weight:900;flex:1}
.clock{color:var(--muted);font-variant-numeric:tabular-nums}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;padding:0}
.trip{font-size:13px;color:var(--muted);margin:-8px 0 14px}

/* 에이전트 대화 */
.feed{display:flex;flex-direction:column;gap:10px;min-height:120px;margin-bottom:16px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:16px;animation:pop .25s ease-out}
.msg.agent{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start;border-left:4px solid var(--free)}
.msg.agent.warn{border-left-color:var(--prep)}
.msg.agent.urgent{border-left-color:var(--travel)}
.msg.agent.late{border-left-color:var(--late)}
.msg.me{background:var(--me);color:var(--meInk);align-self:flex-end;border-top-right-radius:6px;font-size:15px}
.msg b{display:block;font-size:17px;margin-bottom:2px}
.msg .time{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer}
.ask{width:100%;padding:18px;font-size:18px;font-weight:700;background:var(--ink);color:var(--bg);border:none;border-radius:18px}
.ask:active{transform:scale(.98)}
.chips{display:flex;gap:8px;margin:10px 0 20px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 4px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.dialwrap{display:flex;flex-direction:column;align-items:center}
.dialwrap h2,.dialwrap .hint{align-self:flex-start}
svg.dial{width:100%;max-width:280px;touch-action:none;cursor:grab;user-select:none;margin-top:6px}
.center-big{font-size:19px;font-weight:700;fill:var(--ink)}
.center-sm{font-size:12px;fill:var(--muted)}
.center-res{font-size:14px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--travel)}

/* 설정 */
dialog{border:none;border-radius:22px;padding:0;width:min(440px,calc(100% - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:20px}
.sheet h2{margin:0 0 4px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.on{background:var(--ok);color:#fff}
.save{width:100%;margin-top:16px;padding:14px;background:var(--ink);color:var(--bg);border:none;border-radius:14px;font-weight:700}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <h1>지하철 보채기</h1>
    <span class="clock" id="clock">--:--</span>
    <button class="icon" id="openSettings" aria-label="설정">⚙</button>
  </header>
  <p class="trip" id="trip"></p>

  <section class="feed" id="feed" aria-live="polite"></section>

  <button class="ask" id="ask">나 지금 어때?</button>
  <div class="chips">
    <button data-what="0">지금 나가면?</button>
    <button data-what="5">5분 뒤엔?</button>
    <button data-what="10">10분 뒤엔?</button>
  </div>

  <section class="card dialwrap">
    <h2>돌려봐</h2>
    <p class="hint">언제 나가면 어떻게 되는지 보여줄게.</p>
    <svg class="dial" id="dial" viewBox="0 0 300 300" role="img" aria-label="출발 시각 다이얼"></svg>
    <input type="range" id="offset" min="0" max="60" value="0" aria-label="몇 분 뒤 출발할지">
  </section>
</main>

<dialog id="settings">
  <form class="sheet" id="form" method="dialog">
    <h2>설정</h2>
    <p class="hint">한 번만 넣어. 다음부터는 이대로 기억해.</p>
    <div class="grid">
      <div class="full"><label for="dest">어디 가?</label><input id="dest" name="dest" required></div>
      <div><label for="arrive">몇 시까지?</label><input id="arrive" name="arrive" type="time" required></div>
      <div><label for="prep">준비 몇 분 걸려?</label><input id="prep" name="prep" type="number" min="0"></div>
      <div><label for="walkTo">집 → 역 (분)</label><input id="walkTo" name="walkTo" type="number" min="0"></div>
      <div><label for="ride">지하철 타는 시간 (분)</label><input id="ride" name="ride" type="number" min="1"></div>
      <div><label for="walkFrom">역 → 목적지 (분)</label><input id="walkFrom" name="walkFrom" type="number" min="0"></div>
      <div><label for="headway">배차 간격 (분)</label><input id="headway" name="headway" type="number" min="1"></div>
      <div><label for="buffer">여유 (분)</label><input id="buffer" name="buffer" type="number" min="0"></div>
      <div><label for="interval">얼마나 자주 보챌까?</label>
        <select id="interval" name="interval">
          <option value="5">5분마다</option><option value="10">10분마다</option><option value="15">15분마다</option>
        </select></div>
    </div>
    <div class="row">
      <button type="button" id="notifyBtn">알림 켜기</button>
      <button type="button" id="homeBtn">여기가 집이야</button>
      <span class="pill" id="homePill">집 위치 없음</span>
    </div>
    <details>
      <summary>테스트용</summary>
      <div class="grid">
        <div><label for="delay">지연 (분, 데모)</label><input id="delay" name="delay" type="number" min="0"></div>
        <div><label for="sim">시간 당기기 (분)</label><input id="sim" type="range" min="0" max="120" value="0"></div>
      </div>
    </details>
    <button class="save" value="save">저장</button>
  </form>
</dialog>

<script>
const MIN = 60000;
const DEFAULTS = {dest:"회사 (강남역)", arrive:"09:00", prep:25, walkTo:7, ride:22, walkFrom:5, headway:6, buffer:3, interval:10, delay:0, home:null};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("bochae-settings")) }catch{ return null } },
  set(v){ try{ localStorage.setItem("bochae-settings", JSON.stringify(v)) }catch{} }
};
const saved = store.get();
const s = Object.assign({}, DEFAULTS, saved || {});
let configured = !!saved, simMin = 0, selOffset = 0, atHome = false, lastPhase = null;
const sent = new Set();

const $ = id => document.getElementById(id);
const now = () => Date.now() + simMin * MIN;
const hhmm = ms => new Date(ms).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
const mins = ms => Math.round(ms / MIN);
const dur = m => m >= 60 ? `${Math.floor(m/60)}시간${m%60 ? " "+m%60+"분" : ""}` : `${m}분`;

// ---- 열차 시간표 (데모) ----
// 실제 서비스에서는 서울 열린데이터광장 OA-101(시간표) + OA-12764(실시간 도착)로 교체
function trainsBetween(fromMs, toMs){
  const day = new Date(fromMs); day.setHours(0,0,0,0);
  const start = day.getTime() + 2*MIN + s.delay*MIN;
  const step = Math.max(1, s.headway) * MIN;
  const out = [];
  for(let t = start + Math.ceil((fromMs - start) / step) * step; t <= toMs; t += step) out.push(t);
  return out;
}
const nextTrain = ms => trainsBetween(ms, ms + 3*60*MIN)[0];

function targetMs(){
  const [h,m] = s.arrive.split(":").map(Number);
  const d = new Date(now()); d.setHours(h,m,0,0);
  if(d.getTime() < now() - 30*MIN) d.setDate(d.getDate()+1);
  return d.getTime();
}
function plan(){
  const target = targetMs();
  const trains = trainsBetween(target - 4*60*MIN, target - (s.buffer + s.ride + s.walkFrom)*MIN);
  const train = trains[trains.length-1];
  const depart = train - s.walkTo*MIN;
  return {target, train, depart, prepStart: depart - s.prep*MIN};
}
function ifLeaveAt(leave, target){
  const train = nextTrain(leave + s.walkTo*MIN);
  const arrive = train + (s.ride + s.walkFrom)*MIN;
  return {train, arrive, slack: mins(target - arrive)};
}

// ---- 에이전트: 솔직하게, 반말로, 할 일을 말한다 ----
function judge(p, t){
  const toPrep = mins(p.prepStart - t), toDep = mins(p.depart - t);
  if(t > p.target) return {phase:"over", level:"late", title:"오늘은 끝났어.", body:"내일 거 다시 볼게."};
  if(toPrep > 10) return {phase:"free", level:"", title:"아직 안 나가도 돼.", body:`준비는 ${dur(toPrep)} 뒤에 시작해. 출발은 ${dur(toDep)} 뒤.`};
  if(toPrep > 0) return {phase:"soon", level:"warn", title:"하던 거 슬슬 정리해.", body:`${toPrep}분 뒤에 준비 시작이야.`};
  if(toDep > 5) return {phase:"prep", level:"warn", title:"지금 준비 시작해.", body:`지금 하면 안 뛰어도 돼. ${hhmm(p.train)} 열차야. 출발까지 ${toDep}분.`};
  if(toDep > 0) return {phase:"shoes", level:"urgent", title:"신발 신어.", body:`${toDep}분 뒤에 나가야 ${hhmm(p.train)} 열차 걸어서 탄다.`};
  const r = ifLeaveAt(t, p.target);
  if(atHome) return {phase:"home", level:"late", title:"아직 집이지?", body:`지금 바로 나가. ${hhmm(r.train)} 열차 타면 ${r.slack >= 0 ? r.slack+"분 남아" : -r.slack+"분 지각이야"}.`};
  if(r.slack >= 0) return {phase:"go", level:"urgent", title:"출발 시간 지났어.", body:`지금 나가면 아직 안 늦어. ${hhmm(r.train)} 열차, ${r.slack}분 남아. 걸음 빨리.`};
  return {phase:"late", level:"late", title:"이미 늦었어.", body:`지금 나가도 ${-r.slack}분 지각이야. 늦는다고 지금 연락해.`};
}
function whatIf(off){
  const p = plan(), r = ifLeaveAt(now() + off*MIN, p.target);
  const when = off === 0 ? "지금 나가면" : `${off}분 뒤에 나가면`;
  const verdict = r.slack >= 5 ? `${dur(r.slack)} 남아. 괜찮아.`
    : r.slack > 0 ? `${r.slack}분 남아. 빠듯해.`
    : r.slack === 0 ? "딱 맞춰 도착. 여유 없어."
    : `${dur(-r.slack)} 지각이야. 그러지 마.`;
  return {level: r.slack >= 5 ? "" : r.slack >= 0 ? "warn" : "late", title: verdict, body:`${when} ${hhmm(r.train)} 열차 타고 ${hhmm(r.arrive)} 도착.`};
}
function delayNote(p){
  if(s.delay <= 0) return "";
  const d = s.delay; s.delay = 0; const base = plan(); s.delay = d;
  const diff = mins(base.depart - p.depart);
  return diff > 0 ? ` 열차 ${d}분 지연이라 ${diff}분 일찍 나가야 돼.` : ` 열차 ${d}분 지연인데 너한텐 상관없어.`;
}
function current(){ const p = plan(), m = judge(p, now()); m.body += delayNote(p); return m; }

function say(m, who="agent"){
  const el = document.createElement("div");
  el.className = `msg ${who} ${m.level||""}`;
  if(who === "me"){
    el.textContent = m;
  } else {
    el.innerHTML = `<b></b><span></span><span class="time"></span>`;
    el.querySelector("b").textContent = m.title;
    el.querySelector("span").textContent = m.body;
    el.querySelector(".time").textContent = hhmm(now());
  }
  const feed = $("feed"); feed.append(el);
  while(feed.children.length > 6) feed.firstChild.remove();
}

$("ask").addEventListener("click", ()=>{ say("나 지금 어때?", "me"); say(current()); });
document.querySelectorAll("[data-what]").forEach(b=>b.addEventListener("click", ()=>{
  const off = Number(b.dataset.what);
  say(b.textContent, "me"); say(whatIf(off));
  selOffset = off; $("offset").value = off; drawDial();
}));

// ---- 다이얼 ----
const CX=150, CY=150, R=104;
function polar(deg, r=R){ const a=(deg-90)*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)]; }
function arc(d0, d1){
  d0=Math.max(0,d0); d1=Math.min(359.99,d1); if(d1<=d0) return "";
  const [x0,y0]=polar(d0),[x1,y1]=polar(d1);
  return `M${x0} ${y0} A${R} ${R} 0 ${d1-d0>180?1:0} 1 ${x1} ${y1}`;
}
function drawDial(){
  const t = now(), p = plan();
  const W = Math.max(15, Math.min(180, Math.ceil((p.target - t)/MIN)));
  const deg = ms => (ms - t)/MIN / W * 360;
  $("offset").max = W;
  const r = ifLeaveAt(t + selOffset*MIN, p.target);
  const color = r.slack >= 5 ? "var(--ok)" : r.slack >= 0 ? "var(--prep)" : "var(--late)";
  const res = r.slack >= 0 ? `${dur(r.slack)} 남음` : `${dur(-r.slack)} 지각`;
  const [kx,ky] = polar(selOffset / W * 360);
  const ticks = [0,.25,.5,.75].map(f=>{
    const [x,y]=polar(f*360, R+24);
    return `<text x="${x}" y="${y+4}" text-anchor="middle" class="center-sm">${f ? "+"+Math.round(W*f)+"분" : "지금"}</text>`;
  }).join("");
  $("dial").innerHTML = `
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>
    <path d="${arc(0, deg(p.prepStart))}" stroke="var(--free)" stroke-width="18" fill="none"/>
    <path d="${arc(deg(p.prepStart), deg(p.depart))}" stroke="var(--prep)" stroke-width="18" fill="none"/>
    <path d="${arc(deg(p.depart), deg(p.target))}" stroke="var(--travel)" stroke-width="18" fill="none"/>
    ${ticks}
    <circle cx="${kx}" cy="${ky}" r="14" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>
    <text x="${CX}" y="${CY-20}" text-anchor="middle" class="center-big">${selOffset===0?"지금 나가면":selOffset+"분 뒤에 나가면"}</text>
    <text x="${CX}" y="${CY+4}" text-anchor="middle" class="center-sm">${hhmm(r.train)} 열차 · ${hhmm(r.arrive)} 도착</text>
    <text x="${CX}" y="${CY+30}" text-anchor="middle" class="center-res" fill="${color}">${res}</text>`;
}
function setOffsetFromPointer(e){
  const box = $("dial").getBoundingClientRect();
  const x = (e.clientX - box.left)/box.width*300 - CX, y = (e.clientY - box.top)/box.height*300 - CY;
  let deg = Math.atan2(y, x)*180/Math.PI + 90; if(deg<0) deg+=360;
  selOffset = Math.round(deg/360*Number($("offset").max)); $("offset").value = selOffset; drawDial();
}
let dragging=false;
$("dial").addEventListener("pointerdown", e=>{dragging=true; $("dial").setPointerCapture(e.pointerId); setOffsetFromPointer(e);});
$("dial").addEventListener("pointermove", e=>{ if(dragging) setOffsetFromPointer(e); });
$("dial").addEventListener("pointerup", ()=>dragging=false);
$("offset").addEventListener("input", e=>{ selOffset = Number(e.target.value); drawDial(); });

// ---- 에이전트가 먼저 말 건다: 상태가 바뀔 때 + 정해둔 간격마다 ----
function notify(m){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{ new Notification(m.title, {body:m.body, tag:"bochae"}); }catch{}
}
function tick(){
  const t = now(), p = plan(), m = current();
  $("clock").textContent = hhmm(t);
  $("trip").textContent = `${s.dest} · ${s.arrive}까지`;
  drawDial();
  if(!configured) return;
  if(m.phase !== lastPhase){ lastPhase = m.phase; say(m); notify(m); return; }
  for(let mark = p.prepStart - 30*MIN; mark < p.depart; mark += s.interval*MIN){
    const id = p.depart+":"+mark;
    if(t >= mark && t - mark < 2*MIN && !sent.has(id)){ sent.add(id); say(m); notify(m); }
  }
}

// ---- GPS ----
function distM(a,b){
  const toR=x=>x*Math.PI/180, dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(h));
}
function watchHome(){
  if(!s.home || !navigator.geolocation) return;
  $("homePill").textContent = "집 위치 저장됨";
  navigator.geolocation.watchPosition(pos=>{
    const d = distM(s.home, {lat:pos.coords.latitude, lng:pos.coords.longitude});
    atHome = d < 150;
    $("homePill").textContent = atHome ? "지금 집" : `집에서 ${Math.round(d)}m`;
    $("homePill").classList.toggle("on", atHome);
  }, ()=>{ $("homePill").textContent="위치 권한 없음"; }, {maximumAge:60000});
}
$("homeBtn").addEventListener("click", ()=>{
  if(!navigator.geolocation) return alert("위치 못 써.");
  navigator.geolocation.getCurrentPosition(pos=>{
    s.home = {lat:pos.coords.latitude, lng:pos.coords.longitude}; store.set(s); watchHome();
  }, err=>alert("위치 못 가져왔어: "+err.message));
});
$("notifyBtn").addEventListener("click", async ()=>{
  if(!("Notification" in window)) return alert("이 브라우저는 알림 안 돼.");
  const r = await Notification.requestPermission();
  $("notifyBtn").textContent = r==="granted" ? "알림 켜짐" : "알림 꺼짐";
});

// ---- 설정: 한 번 저장하면 계속 그대로 ----
const form = $("form");
function fillForm(){ for(const k of Object.keys(DEFAULTS)) if(form.elements[k]) form.elements[k].value = s[k]; }
$("openSettings").addEventListener("click", ()=>{ fillForm(); $("settings").showModal(); });
$("sim").addEventListener("input", e=>{ simMin = Number(e.target.value); });
form.addEventListener("submit", ()=>{
  for(const k of Object.keys(DEFAULTS)){
    const el = form.elements[k]; if(!el) continue;
    s[k] = el.type==="number" || k==="interval" ? Math.max(0, Number(el.value)||0) : el.value;
  }
  store.set(s); configured = true; lastPhase = null; sent.clear();
  say({level:"", title:"알았어.", body:`${s.dest}, ${s.arrive}까지. 이대로 기억할게.`});
  tick();
});
