<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출발 타이밍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e4e2dc;
  --free:#d9e7dc; --prep:#f2b950; --travel:#3f7fd9; --late:#d9534f; --ok:#2f8f5b;
  --knob:#1d1d1b; --chip:#efeee9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --card:#1f1f1d; --ink:#f1f0ea; --muted:#a3a29c; --line:#34332f;
    --free:#2a3b2f; --prep:#e0a63c; --travel:#5b95e8; --late:#ef6b66; --ok:#4cb37b;
    --knob:#f1f0ea; --chip:#2a2a27;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1f1f1d; --ink:#f1f0ea; --muted:#a3a29c; --line:#34332f;
  --free:#2a3b2f; --prep:#e0a63c; --travel:#5b95e8; --late:#ef6b66; --ok:#4cb37b;
  --knob:#f1f0ea; --chip:#2a2a27;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
h1{font-size:18px;margin:0;font-weight:700}
.clock{color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.status h2{font-size:22px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.status p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.banner{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--chip);display:none}
.banner.show{display:block}
.dialwrap{display:flex;flex-direction:column;align-items:center}
svg.dial{width:100%;max-width:300px;touch-action:none;cursor:grab;user-select:none}
svg.dial:active{cursor:grabbing}
.center-big{font-size:20px;font-weight:700;fill:var(--ink)}
.center-sm{font-size:12.5px;fill:var(--muted)}
.center-res{font-size:14px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--travel)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
h3{font-size:15px;margin:0 0 12px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.on{background:var(--ok);color:#fff}
.timeline{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums;font-size:14px}
.timeline .t{font-weight:700}
.timeline .d{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <h1>출발 타이밍</h1>
    <span class="clock" id="clock">--:--</span>
  </header>

  <section class="card status" aria-live="polite">
    <h2 id="statusTitle">…</h2>
    <p id="statusSub"></p>
    <div class="banner" id="delayBanner"></div>
  </section>

  <section class="card dialwrap">
    <svg class="dial" id="dial" viewBox="0 0 300 300" role="img" aria-label="출발 시각 다이얼"></svg>
    <div class="legend">
      <span><i style="background:var(--free)"></i>여유</span>
      <span><i style="background:var(--prep)"></i>준비</span>
      <span><i style="background:var(--travel)"></i>이동</span>
    </div>
    <input type="range" id="offset" min="0" max="60" value="0" aria-label="몇 분 뒤 출발할지">
    <div class="chips">
      <button data-off="0">지금 출발</button>
      <button data-off="5">5분 뒤</button>
      <button data-off="10">10분 뒤</button>
      <button data-off="plan">권장 출발</button>
    </div>
  </section>

  <section class="card">
    <h3>오늘의 흐름</h3>
    <div class="timeline" id="timeline"></div>
  </section>

  <section class="card">
    <h3>일정</h3>
    <form class="grid" id="form">
      <div class="full"><label for="dest">목적지</label><input id="dest" name="dest"></div>
      <div><label for="arrive">도착 시간</label><input id="arrive" name="arrive" type="time"></div>
      <div><label for="prep">평소 준비 시간(분)</label><input id="prep" name="prep" type="number" min="0"></div>
      <div><label for="walkTo">집 → 역 도보(분)</label><input id="walkTo" name="walkTo" type="number" min="0"></div>
      <div><label for="ride">지하철 탑승(분, 환승 포함)</label><input id="ride" name="ride" type="number" min="1"></div>
      <div><label for="walkFrom">역 → 목적지 도보(분)</label><input id="walkFrom" name="walkFrom" type="number" min="0"></div>
      <div><label for="headway">배차 간격(분)</label><input id="headway" name="headway" type="number" min="1"></div>
      <div><label for="buffer">여유 시간(분)</label><input id="buffer" name="buffer" type="number" min="0"></div>
      <div><label for="interval">알림 간격</label>
        <select id="interval" name="interval">
          <option value="5">5분마다</option><option value="10">10분마다</option><option value="15">15분마다</option>
        </select></div>
      <div class="full"><label for="delay">실시간 지연(분) <span class="pill">데모 · API 연결 전</span></label>
        <input id="delay" name="delay" type="number" min="0">
        <p class="hint">나중에 서울시 실시간 도착정보 API 값으로 대체됩니다.</p></div>
    </form>
  </section>

  <section class="card">
    <h3>알림 · 위치</h3>
    <div class="row">
      <button id="notifyBtn">알림 켜기</button>
      <button id="homeBtn">지금 위치를 집으로 저장</button>
      <span class="pill" id="homePill">집 위치 없음</span>
    </div>
    <p class="hint">집에 있는데 출발 시간이 지나면 “지금 나가면 ○○:○○ 열차를 탈 수 있어요”라고 알려줘요. 브라우저 탭이 열려 있을 때만 동작해요.</p>
    <details style="margin-top:12px">
      <summary>데모: 시간 앞당겨 보기</summary>
      <input type="range" id="sim" min="0" max="120" value="0">
      <p class="hint" id="simLabel">현재 시각 그대로</p>
    </details>
  </section>
</main>

<script>
const MIN = 60000;
const DEFAULTS = {dest:"회사 (강남역)", arrive:"09:00", prep:25, walkTo:7, ride:22, walkFrom:5, headway:6, buffer:3, interval:10, delay:0, home:null};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("departure-plan")) }catch{ return null } },
  set(v){ try{ localStorage.setItem("departure-plan", JSON.stringify(v)) }catch{} }
};
const s = Object.assign({}, DEFAULTS, store.get() || {});
let simMin = 0, selOffset = 0, atHome = false;
const sent = new Set();

const $ = id => document.getElementById(id);
const now = () => Date.now() + simMin * MIN;
const hhmm = ms => new Date(ms).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
const mins = ms => Math.round(ms / MIN);
const dur = m => m >= 60 ? `${Math.floor(m/60)}시간${m%60 ? " "+m%60+"분" : ""}` : `${m}분`;

// ---- 열차 시간표 (데모) ----
// 실제 서비스에서는 서울 열린데이터광장 OA-101(시간표) + OA-12764(실시간 도착)로 교체
function trainsBetween(fromMs, toMs){
  const day = new Date(fromMs); day.setHours(0,0,0,0);
  const start = day.getTime() + 2*MIN + s.delay*MIN; // 매시 2분 기준, 배차 간격마다
  const step = Math.max(1, s.headway) * MIN;
  const out = [];
  let t = start + Math.ceil((fromMs - start) / step) * step;
  for(; t <= toMs; t += step) out.push(t);
  return out;
}
function nextTrain(ms){ return trainsBetween(ms, ms + 3*60*MIN)[0]; }

function targetMs(){
  const [h,m] = s.arrive.split(":").map(Number);
  const d = new Date(now()); d.setHours(h,m,0,0);
  if(d.getTime() < now() - 30*MIN) d.setDate(d.getDate()+1);
  return d.getTime();
}

function plan(){
  const target = targetMs();
  const latestTrainAt = target - (s.buffer + s.ride + s.walkFrom)*MIN;
  const trains = trainsBetween(latestTrainAt - 3*60*MIN, latestTrainAt);
  const train = trains[trains.length-1];
  const depart = train - s.walkTo*MIN;
  return {target, train, depart, prepStart: depart - s.prep*MIN, arrive: train + (s.ride+s.walkFrom)*MIN};
}
function ifLeaveAt(leave, target){
  const train = nextTrain(leave + s.walkTo*MIN);
  const arrive = train + (s.ride + s.walkFrom)*MIN;
  return {train, arrive, slack: mins(target - arrive)};
}

// ---- 상태 메시지: "서두르세요" 대신 할 수 있는 행동을 알려줌 ----
function message(p, t){
  const toPrep = mins(p.prepStart - t), toDep = mins(p.depart - t);
  if(t > p.target) return {title:"도착 시간이 지났어요.", sub:"내일 일정을 확인하거나 도착 시간을 바꿔 주세요."};
  if(toPrep > 10) return {title:"지금은 여유 있어요.", sub:`준비 시작까지 ${dur(toPrep)} · 출발까지 ${dur(toDep)}`};
  if(toPrep > 0) return {title:"곧 준비할 시간이에요.", sub:`지금 하던 일을 ${toPrep}분 안에 마무리하면 딱 맞아요.`};
  if(toDep > 5) return {title:"지금 준비를 시작하면 뛰지 않아도 돼요.", sub:`출발까지 ${toDep}분 · ${hhmm(p.train)} 열차`};
  if(toDep > 0) return {title:"신발 신을 시간이에요.", sub:`${toDep}분 뒤 나가면 ${hhmm(p.train)} 열차를 걸어서 탈 수 있어요.`};
  const r = ifLeaveAt(t, p.target);
  if(r.slack >= 0) return {title:"지금 나가면 아직 늦지 않아요.", sub:`${hhmm(r.train)} 열차 · ${hhmm(r.arrive)} 도착 (${r.slack}분 여유)`};
  return {title:`지금 출발하면 ${-r.slack}분 늦어요.`, sub:`${hhmm(r.train)} 열차가 다음이에요. 미리 연락해두면 마음이 편해요.`};
}

// ---- 다이얼 ----
const CX=150, CY=150, R=104;
function polar(deg, r=R){ const a=(deg-90)*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)]; }
function arc(d0, d1){
  d0=Math.max(0,d0); d1=Math.min(359.99,d1); if(d1<=d0) return "";
  const [x0,y0]=polar(d0),[x1,y1]=polar(d1);
  return `M${x0} ${y0} A${R} ${R} 0 ${d1-d0>180?1:0} 1 ${x1} ${y1}`;
}
function windowMin(p, t){ return Math.max(15, Math.min(180, Math.ceil((p.target - t)/MIN))); }

function drawDial(p, t){
  const W = windowMin(p, t);
  const deg = ms => (ms - t)/MIN / W * 360;
  $("offset").max = W;
  const r = ifLeaveAt(t + selOffset*MIN, p.target);
  const resColor = r.slack >= 0 ? "var(--ok)" : "var(--late)";
  const resText = r.slack >= 0 ? `${dur(r.slack)} 여유` : `${dur(-r.slack)} 늦음`;
  const [kx,ky] = polar(selOffset / W * 360);
  const ticks = [0,.25,.5,.75].map(f=>{
    const [x,y]=polar(f*360, R+24);
    return `<text x="${x}" y="${y+4}" text-anchor="middle" class="center-sm">${f? "+"+Math.round(W*f)+"분" : "지금"}</text>`;
  }).join("");
  $("dial").innerHTML = `
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>
    <path d="${arc(0, deg(p.prepStart))}" stroke="var(--free)" stroke-width="18" fill="none"/>
    <path d="${arc(deg(p.prepStart), deg(p.depart))}" stroke="var(--prep)" stroke-width="18" fill="none"/>
    <path d="${arc(deg(p.depart), deg(p.target))}" stroke="var(--travel)" stroke-width="18" fill="none"/>
    ${ticks}
    <line x1="${CX}" y1="${CY}" x2="${kx}" y2="${ky}" stroke="var(--knob)" stroke-width="1.5" stroke-dasharray="3 4" opacity=".4"/>
    <circle cx="${kx}" cy="${ky}" r="14" fill="var(--card)" stroke="var(--knob)" stroke-width="3"/>
    <text x="${CX}" y="${CY-22}" text-anchor="middle" class="center-big">${selOffset===0?"지금 출발":selOffset+"분 뒤 출발"}</text>
    <text x="${CX}" y="${CY+4}" text-anchor="middle" class="center-sm">${hhmm(r.train)} 열차 · ${hhmm(r.arrive)} 도착</text>
    <text x="${CX}" y="${CY+30}" text-anchor="middle" class="center-res" fill="${resColor}">${resText}</text>`;
}
function setOffsetFromPointer(e){
  const box = $("dial").getBoundingClientRect();
  const x = (e.clientX - box.left)/box.width*300 - CX, y = (e.clientY - box.top)/box.height*300 - CY;
  let deg = Math.atan2(y, x)*180/Math.PI + 90; if(deg<0) deg+=360;
  const W = Number($("offset").max);
  selOffset = Math.round(deg/360*W); $("offset").value = selOffset; render();
}
let dragging=false;
$("dial").addEventListener("pointerdown", e=>{dragging=true; $("dial").setPointerCapture(e.pointerId); setOffsetFromPointer(e);});
$("dial").addEventListener("pointermove", e=>{ if(dragging) setOffsetFromPointer(e); });
$("dial").addEventListener("pointerup", ()=>dragging=false);
$("offset").addEventListener("input", e=>{ selOffset = Number(e.target.value); render(); });
document.querySelectorAll("[data-off]").forEach(b=>b.addEventListener("click", ()=>{
  const v=b.dataset.off; selOffset = v==="plan" ? Math.max(0, mins(plan().depart - now())) : Number(v);
  $("offset").value = selOffset; render();
}));

// ---- 알림 ----
function notify(title, body){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{ new Notification(title, {body, tag:"departure"}); }catch{}
}
function checkNotifications(p, t){
  const I = s.interval*MIN, key = p.depart;
  const marks = new Set([p.prepStart, p.depart]);
  for(let m = p.prepStart - 30*MIN; m < p.depart; m += I) marks.add(m);
  for(const m of marks){
    const id = key+":"+m;
    if(t >= m && t - m < 2*MIN && !sent.has(id)){
      sent.add(id); const msg = message(p, t); notify(msg.title, msg.sub);
    }
  }
  if(atHome && t >= p.depart && t < p.target && !sent.has(key+":home")){
    sent.add(key+":home");
    const r = ifLeaveAt(t, p.target);
    notify("아직 집이시네요.", `지금 나가면 ${hhmm(r.train)} 열차를 탈 수 있어요.`);
  }
}
$("notifyBtn").addEventListener("click", async ()=>{
  if(!("Notification" in window)) return alert("이 브라우저는 알림을 지원하지 않아요.");
  const r = await Notification.requestPermission();
  $("notifyBtn").textContent = r==="granted" ? "알림 켜짐" : "알림 꺼짐";
});

// ---- GPS: 집에 있는지 확인 ----
function distM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function watchHome(){
  if(!s.home || !navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos=>{
    const d = distM(s.home, {lat:pos.coords.latitude, lng:pos.coords.longitude});
    atHome = d < 150;
    $("homePill").textContent = atHome ? "집에 있음" : `집에서 ${Math.round(d)}m`;
    $("homePill").classList.toggle("on", atHome);
  }, ()=>{ $("homePill").textContent="위치 권한 없음"; }, {enableHighAccuracy:false, maximumAge:60000});
}
$("homeBtn").addEventListener("click", ()=>{
  if(!navigator.geolocation) return alert("위치 기능을 사용할 수 없어요.");
  navigator.geolocation.getCurrentPosition(pos=>{
    s.home = {lat:pos.coords.latitude, lng:pos.coords.longitude}; store.set(s); watchHome();
  }, err=>alert("위치를 가져오지 못했어요: "+err.message));
});

// ---- 폼 ----
const form = $("form");
for(const k of Object.keys(DEFAULTS)) if(form.elements[k]) form.elements[k].value = s[k];
form.addEventListener("input", ()=>{
  for(const k of Object.keys(DEFAULTS)){
    const el = form.elements[k]; if(!el) continue;
    s[k] = el.type==="number"||k==="interval" ? Math.max(0, Number(el.value)||0) : el.value;
  }
  store.set(s); render();
});
$("sim").addEventListener("input", e=>{
  simMin = Number(e.target.value);
  $("simLabel").textContent = simMin ? `현재 시각 +${simMin}분 (${hhmm(now())})` : "현재 시각 그대로";
  render();
});

// ---- 렌더 ----
function render(){
  const t = now(), p = plan();
  $("clock").textContent = hhmm(t);
  const m = message(p, t);
  $("statusTitle").textContent = m.title; $("statusSub").textContent = m.sub;

  const banner = $("delayBanner");
  if(s.delay > 0){
    const saved = s.delay; s.delay = 0; const base = plan(); s.delay = saved;
    const diff = mins(base.depart - p.depart);
    banner.textContent = diff > 0
      ? `열차가 ${s.delay}분 지연 중이라 출발 안내를 ${diff}분 앞당겼어요.`
      : `열차가 ${s.delay}분 지연 중이지만 지금 계획엔 영향이 없어요.`;
    banner.classList.add("show");
  } else banner.classList.remove("show");

  $("timeline").innerHTML = [
    [p.prepStart,"준비 시작",`${s.prep}분`],
    [p.depart,"집에서 출발",`역까지 ${s.walkTo}분`],
    [p.train,"열차 탑승",`${s.ride}분`],
    [p.arrive,`${s.dest} 도착`,`목표 ${hhmm(p.target)}`],
  ].map(([ms,l,d])=>`<span class="t">${hhmm(ms)}</span><span>${l}</span><span class="d">${d}</span>`).join("");

  drawDial(p, t);
  checkNotifications(p, t);
}
if(s.home) watchHome();
render();
setInterval(render, 15000);
</script>
</body>
</html>
