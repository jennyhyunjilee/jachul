<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잔소리역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 스티커 느낌: 굵은 테두리 + 딱딱한 그림자 + 형광 포인트 */
:root{
  --bg:#f3efe6; --card:#ffffff; --ink:#111111; --muted:#6e6a62; --line:#111111; --soft:#e6e0d3;
  --free:#c8f560; --prep:#ff8ac2; --travel:#6c5ce7; --late:#ff4d2e; --ok:#14965f;
  --chip:#ffffff; --me:#111111; --meInk:#f3efe6; --goal:#111111; --goalInk:#f3efe6; --goalMuted:#a19c90;
  --accent:#c8f560; --accentInk:#111111; --shadow:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0e; --card:#1a1a1a; --ink:#f3efe6; --muted:#a19c90; --line:#f3efe6; --soft:#2c2c2c;
    --free:#b8f03f; --prep:#ff7ab8; --travel:#8c7cff; --late:#ff6a4d; --ok:#3ddc97;
    --chip:#1a1a1a; --me:#f3efe6; --meInk:#0e0e0e; --goal:#1a1a1a; --goalInk:#f3efe6; --goalMuted:#a19c90;
    --shadow:#c8f560;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0e; --card:#1a1a1a; --ink:#f3efe6; --muted:#a19c90; --line:#f3efe6; --soft:#2c2c2c;
  --free:#b8f03f; --prep:#ff7ab8; --travel:#8c7cff; --late:#ff6a4d; --ok:#3ddc97;
  --chip:#1a1a1a; --me:#f3efe6; --meInk:#0e0e0e; --goal:#1a1a1a; --goalInk:#f3efe6; --goalMuted:#a19c90;
  --shadow:#c8f560;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.mono,.clock,.route .t,.trains .eta{font-family:"Space Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:18px 16px 56px}
header{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
h1{font-size:26px;margin:0;font-weight:900;letter-spacing:-.05em;line-height:1.1;display:inline;background:linear-gradient(transparent 58%,var(--accent) 58%);color:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) h1{background:none;color:var(--accent)} }
:root[data-theme="dark"] h1{background:none;color:var(--accent)}
.tagline{font-size:12px;color:var(--muted);margin:4px 0 0}
.clock{font-size:15px;font-weight:700}
.icon{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;padding:0;flex:none;box-shadow:3px 3px 0 var(--shadow)}
.source{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:10px 0 14px}
.source i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.source.live i{background:var(--ok);animation:pulse 1.6s infinite}
.source.err i{background:var(--late)}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 25%,transparent)}}
button{font:inherit;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;color:#fff;font-size:11px;font-weight:700;vertical-align:1px;white-space:nowrap;border:1.5px solid rgba(0,0,0,.25)}

/* 목표 카드 */
.goal{background:var(--goal);color:var(--goalInk);border-radius:24px;padding:18px;margin-bottom:18px;border:2px solid var(--line);box-shadow:5px 5px 0 var(--accent)}
.goal-label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--accent);color:var(--accentInk);padding:2px 8px;border-radius:999px}
.goal-head{font-size:26px;font-weight:900;margin:6px 0 14px;letter-spacing:-.04em;line-height:1.2}
.goal-head .empty{color:var(--goalMuted)}
.stations{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:stretch}
.field{display:block;min-width:0;overflow:hidden;text-align:left;border-radius:16px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--goalInk);padding:10px 12px;width:100%;min-height:62px;box-shadow:none;font-weight:400}
.field small{display:block;font-size:11.5px;color:var(--goalMuted)}
.field .v{font-size:16px;font-weight:700;white-space:nowrap}
.field .v.empty{color:var(--goalMuted);font-weight:500}
.swap{align-self:center;background:var(--accent);color:var(--accentInk);border-color:var(--accent);width:36px;height:36px;padding:0;box-shadow:none}
.goal-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.field input[type=time]{font:inherit;font-family:"Space Mono",monospace;font-size:16px;font-weight:700;background:transparent;border:none;color:var(--goalInk);padding:0;width:100%;color-scheme:dark}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{background:transparent;color:var(--goalInk);border:1.5px solid rgba(255,255,255,.3);width:30px;height:30px;padding:0;line-height:1;flex:none;box-shadow:none}
.stepper .v{flex:1;text-align:center}
.goal-sum{margin:12px 0 0;font-size:13px;color:var(--goalMuted)}

/* 에이전트 */
.feed{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:90%;padding:12px 14px;border-radius:18px;font-size:15.5px;animation:pop .25s ease-out;border:2px solid var(--line)}
.msg.agent{background:var(--card);border-top-left-radius:6px;align-self:flex-start;box-shadow:4px 4px 0 var(--free)}
.msg.agent.warn{box-shadow:4px 4px 0 var(--prep)}
.msg.agent.urgent{box-shadow:4px 4px 0 var(--travel)}
.msg.agent.late{box-shadow:4px 4px 0 var(--late)}
.msg.me{background:var(--me);color:var(--meInk);align-self:flex-end;border-top-right-radius:6px;font-size:14.5px;font-weight:700}
.msg b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:2px}
.msg .time{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-family:"Space Mono",monospace}
@keyframes pop{from{opacity:0;transform:translateY(6px) rotate(-1deg)}to{opacity:1;transform:none}}
.ask{width:100%;padding:16px;font-size:19px;font-weight:900;letter-spacing:-.02em;background:var(--accent);color:var(--accentInk);border:2px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ask{box-shadow:5px 5px 0 var(--prep)} }
:root[data-theme="dark"] .ask{box-shadow:5px 5px 0 var(--prep)}
.ask:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow)}
.chips{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px;box-shadow:5px 5px 0 var(--shadow)}
.card h2{font-size:17px;font-weight:900;letter-spacing:-.03em;margin:0 0 2px}
body:not(.ready) .needgoal{display:none !important}

/* 다이얼 */
.dialwrap{display:flex;flex-direction:column;align-items:center}
.dialwrap h2,.dialwrap .hint{align-self:flex-start}
svg.dial{width:100%;max-width:280px;touch-action:none;cursor:grab;user-select:none;margin-top:6px}
.center-big{font-size:19px;font-weight:900;fill:var(--ink)}
.center-sm{font-size:12px;fill:var(--muted)}
.center-res{font-size:14px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--travel)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--line)}

/* 경로 */
.route{list-style:none;margin:12px 0 0;padding:0}
.route li{display:grid;grid-template-columns:50px 18px 1fr;gap:0 10px;align-items:start;min-height:44px}
.route .t{font-weight:700;font-size:13.5px;padding-top:1px}
.route .rail{position:relative;height:100%;display:flex;justify-content:center}
.route .rail::before{content:"";position:absolute;top:0;bottom:0;width:5px;border-radius:3px;background:var(--seg,var(--soft))}
.route li:last-child .rail::before{display:none}
.route .dot{position:relative;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--dotc,var(--ink));margin-top:4px}
.route .what{font-size:14.5px;padding-bottom:12px}
.route .what small{display:block;color:var(--muted);font-size:12.5px}
.route .xfer .what{font-weight:700}
.route .xfer .what > :first-child,.route .xfer .what{color:var(--ink)}
.route .xfer .what{background:color-mix(in srgb,var(--prep) 30%,transparent);border-radius:10px;padding:4px 8px;margin:-4px 0 8px -8px}
.route .verdict{font-weight:900}

/* 실시간 열차 */
svg.strip{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.bob{animation:bob .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.bob.mine{animation-duration:.5s}
.blink{animation:blink 3.4s infinite;transform-box:fill-box;transform-origin:center}
.wiggle{animation:wiggle 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){ .bob,.blink,.wiggle,.source.live i{animation:none} }
.trains{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px}
.trains li{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:10px}
.trains .eta{font-weight:700;min-width:46px}
.trains .mine{background:var(--accent);color:var(--accentInk);font-weight:700}
.trains .gone{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

/* 시트 */
dialog{border:2px solid var(--line);border-radius:22px;padding:0;width:min(440px,calc(100% - 24px));max-height:86vh;background:var(--card);color:var(--ink);box-shadow:6px 6px 0 var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{padding:18px}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:900;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.sheet input,.sheet select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.on{background:var(--ok);color:#fff}
.save{width:100%;margin-top:16px;padding:14px;background:var(--accent);color:var(--accentInk);border-radius:14px;font-weight:900}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.list{list-style:none;margin:10px 0 0;padding:0;max-height:52vh;overflow:auto}
.list button{width:100%;text-align:left;border:none;border-bottom:1.5px solid var(--soft);border-radius:0;background:transparent;padding:12px 4px;display:flex;align-items:center;gap:6px;font-size:16px;flex-wrap:wrap;box-shadow:none}
.list .sec{font-size:12px;color:var(--muted);padding:10px 4px 4px}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <h1>잔소리역</h1>
      <p class="tagline">늦기 전에 먼저 보채는 지하철 에이전트</p>
    </div>
    <span class="clock" id="clock">--:--</span>
    <button class="icon" id="openSettings" aria-label="설정">⚙</button>
  </header>
  <div class="source" id="source"><i></i><span>연결 확인 중…</span></div>

  <!-- 1. 목표: 모든 판단의 기준 -->
  <section class="goal" aria-label="오늘 목표">
    <div class="goal-label">오늘 목표</div>
    <div class="goal-head" id="goalHead"></div>
    <div class="stations">
      <button class="field" id="fromBtn"><small>어디서 타?</small><span class="v" id="fromV"></span></button>
      <button class="swap" id="swapBtn" aria-label="출발역과 도착역 바꾸기">⇄</button>
      <button class="field" id="toBtn"><small>어디서 내려?</small><span class="v" id="toV"></span></button>
    </div>
    <div class="goal-row">
      <label class="field"><small>몇 시까지?</small><input type="time" id="arriveIn"></label>
      <div class="field"><small>준비 시간</small>
        <div class="stepper"><button id="prepMinus" aria-label="준비 시간 5분 줄이기">−</button><span class="v" id="prepV"></span><button id="prepPlus" aria-label="준비 시간 5분 늘리기">+</button></div>
      </div>
    </div>
    <p class="goal-sum" id="goalSum"></p>
  </section>

  <!-- 2. 에이전트 -->
  <section class="feed" id="feed" aria-live="polite"></section>
  <button class="ask" id="ask">나 지금 어때?</button>
  <div class="chips needgoal" id="whatChips">
    <button data-what="0">지금 나가면?</button>
    <button data-what="5">5분 뒤엔?</button>
    <button data-what="10">10분 뒤엔?</button>
  </div>

  <!-- 3. 돌려보기 -->
  <section class="card dialwrap needgoal">
    <h2>돌려봐</h2>
    <p class="hint">언제 나가면 목표 시간에 맞는지 바로 보여줄게.</p>
    <svg class="dial" id="dial" viewBox="0 0 300 300" role="img" aria-label="출발 시각 다이얼"></svg>
    <input type="range" id="offset" min="0" max="60" value="0" aria-label="몇 분 뒤 출발할지">
    <div class="legend">
      <span><i style="background:var(--free)"></i>여유</span>
      <span><i style="background:var(--prep)"></i>준비</span>
      <span><i style="background:var(--travel)"></i>이동</span>
    </div>
  </section>

  <!-- 4. 경로 -->
  <section class="card needgoal">
    <h2>이렇게 가</h2>
    <p class="hint" id="routeHint"></p>
    <ol class="route" id="route"></ol>
  </section>

  <!-- 5. 실시간 열차 -->
  <section class="card needgoal">
    <h2 id="liveTitle">지금 오는 열차</h2>
    <p class="hint" id="liveHint"></p>
    <svg class="strip" id="strip" viewBox="0 0 340 180" role="img" aria-label="다가오는 열차 위치"></svg>
    <ul class="trains" id="trains"></ul>
  </section>
</main>

<!-- 역 고르기 -->
<dialog id="picker">
  <div class="sheet">
    <h2 id="pickerTitle">역 고르기</h2>
    <input id="pickerSearch" type="search" placeholder="역 이름 검색 (예: 강남)" autocomplete="off">
    <ul class="list" id="pickerList"></ul>
    <button class="save" id="pickerClose" style="background:var(--chip);color:var(--ink)">닫기</button>
  </div>
</dialog>

<!-- 자주 안 바꾸는 설정 -->
<dialog id="settings">
  <form class="sheet" id="form" method="dialog">
    <h2>설정</h2>
    <p class="hint">한 번 넣으면 이대로 기억해.</p>
    <div class="grid">
      <div><label for="walkTo">집 → 출발역 도보 (분)</label><input id="walkTo" name="walkTo" type="number" min="0"></div>
      <div><label for="walkFrom">도착역 → 목적지 도보 (분)</label><input id="walkFrom" name="walkFrom" type="number" min="0"></div>
      <div><label for="buffer">여유 (분)</label><input id="buffer" name="buffer" type="number" min="0"></div>
      <div><label for="interval">얼마나 자주 보챌까?</label>
        <select id="interval" name="interval">
          <option value="5">5분마다</option><option value="10">10분마다</option><option value="15">15분마다</option>
        </select></div>
    </div>
    <div class="row">
      <button type="button" id="notifyBtn">알림 켜기</button>
      <button type="button" id="homeBtn">여기가 집이야</button>
      <span class="pill" id="homePill">집 위치 없음</span>
    </div>
    <details>
      <summary>테스트용</summary>
      <div class="grid">
        <div><label for="delay">열차 지연 (분, 데모 노선만)</label><input id="delay" name="delay" type="number" min="0"></div>
        <div><label for="sim">시간 당기기 (분)</label><input id="sim" type="range" min="0" max="120" value="0"></div>
      </div>
    </details>
    <button class="save" value="save">저장</button>
  </form>
</dialog>

<script>
const MIN = 60000, XFER_WALK = 4;

// ---- 노선 메타 (lines.py 와 같음) ----
const LINE_META = {
  "1001":{name:"1호선",short:"1",c:"#0052A4",ride:2.5,h:6}, "1002":{name:"2호선",short:"2",c:"#00A84D",ride:2,h:4},
  "1003":{name:"3호선",short:"3",c:"#EF7C1C",ride:2,h:6},   "1004":{name:"4호선",short:"4",c:"#00A5DE",ride:2,h:5},
  "1005":{name:"5호선",short:"5",c:"#996CAC",ride:2,h:6},   "1006":{name:"6호선",short:"6",c:"#CD7C2F",ride:2,h:7},
  "1007":{name:"7호선",short:"7",c:"#747F00",ride:2,h:6},   "1008":{name:"8호선",short:"8",c:"#E6186C",ride:2,h:6},
  "1009":{name:"9호선",short:"9",c:"#BDB092",ride:2,h:6},   "1063":{name:"경의중앙선",short:"경의",c:"#77C4A3",ride:3,h:12},
  "1065":{name:"공항철도",short:"공항",c:"#0090D2",ride:3.5,h:10}, "1067":{name:"경춘선",short:"경춘",c:"#0C8E72",ride:3.5,h:20},
  "1075":{name:"수인분당선",short:"수분",c:"#FABE00",ride:2.5,h:8}, "1077":{name:"신분당선",short:"신분",c:"#D4003B",ride:3,h:6},
  "1081":{name:"경강선",short:"경강",c:"#003DA5",ride:4,h:15}, "1092":{name:"우이신설선",short:"우이",c:"#B0CE18",ride:1.5,h:5},
  "1093":{name:"서해선",short:"서해",c:"#81A914",ride:3,h:15}, "1094":{name:"신림선",short:"신림",c:"#6789CA",ride:1.5,h:5},
  "1032":{name:"GTX-A",short:"GTX",c:"#9A6292",ride:5,h:10},
};

// ---- 데모 노선 (API 키 없을 때만): 1·2·3·4·5·7·9호선 주요 구간 ----

  "1001":["청량리","제기동","신설동","동묘앞","동대문","종로5가","종로3가","종각","시청","서울역","남영","용산","노량진","대방","신길","영등포","신도림","구로"],

function demoNet(){
  const nodes = {}, edges = [];
  for(const [l, list] of Object.entries(DEMO)){
    const st = list.filter(x => x !== "@loop");
    st.forEach((n, i) => { nodes[`${l}:${i}`] = {n, l}; if(i) edges.push([`${l}:${i-1}`, `${l}:${i}`]); });
    if(list.includes("@loop")) edges.push([`${l}:${st.length-1}`, `${l}:0`]);
  }
  return {demo:true, nodes, edges};
}

// ---- 그래프 ----
let NET, ADJ, BYNAME;
function prepare(net){
  NET = net; ADJ = new Map(); BYNAME = new Map();
  for(const [id, nd] of Object.entries(net.nodes)){
    ADJ.set(id, []);
    if(!BYNAME.has(nd.n)) BYNAME.set(nd.n, []);
    BYNAME.get(nd.n).push(id);
  }
  for(const [a,b] of net.edges) if(ADJ.has(a) && ADJ.has(b)){ ADJ.get(a).push(b); ADJ.get(b).push(a); }
}
const lineOf = id => NET.nodes[id].l, nameOf = id => NET.nodes[id].n;
const meta = l => LINE_META[l] || (NET.lines && NET.lines[l]) || {name:l, short:"?", c:"#888", ride:2, h:8};
const badge = l => `<span class="lb" style="background:${meta(l).c}">${meta(l).short}</span>`;
const linesAt = name => [...new Set((BYNAME.get(name)||[]).map(lineOf))].sort();
const badges = name => linesAt(name).map(badge).join(" ");

// ---- 저장 ----
const DEFAULTS = {from:"", to:"", arrive:"", prep:25, walkTo:7, walkFrom:5, buffer:3, interval:10, delay:0, home:null, recent:[]};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("jansori-v1")) }catch{ return null } },
  set(v){ try{ localStorage.setItem("jansori-v1", JSON.stringify(v)) }catch{} }
};
const s = Object.assign({}, DEFAULTS, store.get() || {});
let simMin = 0, selOffset = 0, atHome = false, lastPhase = null, route = null, forceSay = false;
let STATUS = {key:false}, live = null;
const sent = new Set();

const $ = id => document.getElementById(id);
const now = () => Date.now() + simMin * MIN;
const hhmm = ms => new Date(ms).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
const mins = ms => Math.round(ms / MIN);
const dur = m => m >= 60 ? `${Math.floor(m/60)}시간${m%60 ? " "+m%60+"분" : ""}` : `${m}분`;
const ready = () => !!(route && s.arrive);
const isLive = () => STATUS.key && !NET.demo;

// ---- 경로 찾기: 역 사이 시간 + 환승(걷기 + 평균 대기) ----
function findRoute(from, to){
  if(!BYNAME.has(from) || !BYNAME.has(to) || from === to) return null;
  const dist = new Map(), prev = new Map(), done = new Set();
  for(const id of BYNAME.get(from)) dist.set(id, 0);
  while(true){
    let best = null, bd = Infinity;
    for(const [k,d] of dist) if(!done.has(k) && d < bd){ best = k; bd = d; }
    if(best === null) return null;
    done.add(best);
    if(nameOf(best) === to){
      const path = [];
      for(let k = best; k !== undefined; k = prev.get(k)) path.unshift(k);
      return toLegs(path);
    }
    const relax = (k, w) => { if(!done.has(k) && bd + w < (dist.get(k) ?? Infinity)){ dist.set(k, bd + w); prev.set(k, best); } };
    for(const nb of ADJ.get(best)) relax(nb, meta(lineOf(best)).ride);
    for(const o of BYNAME.get(nameOf(best))) if(o !== best) relax(o, XFER_WALK + meta(lineOf(o)).h/2);
  }
}
function toLegs(path){
  const legs = [];
  for(let i = 0; i < path.length-1; i++){
    const a = path[i], b = path[i+1];
    if(lineOf(a) !== lineOf(b)) continue; // 환승
    const last = legs[legs.length-1];
    if(last && last.ids[last.ids.length-1] === a) last.ids.push(b);
    else legs.push({l:lineOf(a), ids:[a, b]});
  }
  return legs.map(g => ({...g, from:nameOf(g.ids[0]), to:nameOf(g.ids[g.ids.length-1]),
    stops:g.ids.length-1, next:g.ids[1], toward:`${nameOf(g.ids[1])} 방면`}));
}
const legRide = l => Math.round(l.stops * meta(l.l).ride);

// ---- 열차 시각: 첫 구간은 실시간, 나머지는 배차 간격으로 추정 ----
function hash(str){ let h = 7; for(const ch of str) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; }
function modelNext(leg, t){
  const m = meta(leg.l), h = m.h*MIN;
  const day = new Date(t); day.setHours(0,0,0,0);
  const first = day.getTime() + (hash(leg.ids[0]+leg.next) % m.h)*MIN + (NET.demo ? s.delay*MIN : 0);
  return first + Math.ceil((t - first)/h)*h;
}
function liveTrains(leg){
  if(!isLive() || !live || live.station !== leg.from) return [];
  const ride = meta(leg.l).ride, seen = new Set(), out = [];
  // 종착역이 내릴 역보다 앞이면(예: 신도림행인데 교대까지 가야 함) 그 열차는 못 탐
  const before = new Set([leg.from, ...leg.ids.slice(1, -1).map(nameOf)]);
  for(const r of live.rows){
    if(r.subwayId !== leg.l || r.statnTid !== leg.next || seen.has(r.btrainNo)) continue;
    seen.add(r.btrainNo);
    const base = r.recptnDt ? new Date(r.recptnDt.replace(" ","T")+"+09:00").getTime() : live.at;
    const away = parseInt((r.ordkey||"").slice(2,5), 10) || 0, cd = String(r.arvlCd), sec = Number(r.barvlDt)||0;
    if(cd === "2" && away === 0) continue; // 이미 출발
    let m;
    if(sec > 0) m = sec/60;
    else if(cd === "0" || cd === "1") m = 0;
    else m = Math.max(1, away) * ride - (cd === "3" ? ride*0.3 : 0);
    out.push({at: base + m*MIN, dest:r.bstatnNm, msg:r.arvlMsg2, express:r.btrainSttus && r.btrainSttus !== "일반", last:r.lstcarAt === "1", short: before.has(r.bstatnNm)});
  }
  return out.filter(x => x.at >= now() - 30000).sort((a,b) => a.at - b.at);
}
function nextTrain(leg, t, first){
  const lv = first ? liveTrains(leg).filter(x => !x.short) : [];
  if(lv.length){
    const hit = lv.find(x => x.at >= t);
    if(hit) return hit.at;
    const h = meta(leg.l).h*MIN, last = lv[lv.length-1].at;
    return last + Math.ceil((t - last)/h)*h;
  }
  return modelNext(leg, t);
}
function simulate(leave){
  let t = leave + s.walkTo*MIN;
  const legs = route.map((l, k) => {
    if(k > 0) t += XFER_WALK*MIN;
    const readyAt = t, board = nextTrain(l, t, k === 0);
    t = board + legRide(l)*MIN;
    return {...l, readyAt, board, alight:t};
  });
  return {leave, legs, arrive: t + s.walkFrom*MIN};
}
function targetMs(){
  const [h,m] = s.arrive.split(":").map(Number);
  const d = new Date(now()); d.setHours(h,m,0,0);
  if(d.getTime() < now() - 30*MIN) d.setDate(d.getDate()+1);
  return d.getTime();
}
function plan(){
  const target = targetMs(), deadline = target - s.buffer*MIN;
  let L = Math.floor(deadline/MIN)*MIN;
  for(let k = 0; k < 600 && simulate(L).arrive > deadline; k++) L -= MIN;
  return {target, leave:L, prepStart:L - s.prep*MIN, sim:simulate(L)};
}
const slackOf = (sim, target) => mins(target - sim.arrive);
const xferText = () => route.slice(1).map(l => `${l.from}에서 ${meta(l.l).name}`).join(", ") + " 환승";

// ---- 에이전트: 목표 기준으로, 솔직하게, 할 일을 말한다 ----
function judge(p, t){
  if(!s.from || !s.to) return {phase:"nogoal", level:"warn", title:"목표부터 정해.", body:"어디서 타서 어디서 내리는지 위에서 골라. 그래야 늦는지 안 늦는지 말해줄 수 있어."};
  if(s.from === s.to) return {phase:"same", level:"warn", title:"출발역이랑 도착역이 같아.", body:"하나 바꿔."};
  if(!route) return {phase:"noroute", level:"warn", title:"길을 못 찾았어.", body:`${s.from}에서 ${s.to} 가는 지하철 경로가 없어. 역을 다시 골라.`};
  if(!s.arrive) return {phase:"notime", level:"warn", title:"몇 시까지 가야 돼?", body:`${s.to}에 몇 시까지 도착해야 하는지 넣어.`};
  const toPrep = mins(p.prepStart - t), toDep = mins(p.leave - t), first = p.sim.legs[0];
  const src = isLive() && liveTrains(first).length ? " (실시간 기준)" : "";
  const xf = route.length > 1 ? ` ${xferText()}까지 쳐서 계산한 거야.` : "";
  if(t > p.target) return {phase:"over", level:"late", title:"약속 시간 지났어.", body:"내일 목표 다시 정해."};
  if(toPrep > 10) return {phase:"free", level:"", title:"아직 안 나가도 돼.", body:`${s.arrive}까지 ${s.to} 가려면 준비는 ${dur(toPrep)} 뒤, 집에서 나가는 건 ${dur(toDep)} 뒤야.`};
  if(toPrep > 0) return {phase:"soon", level:"warn", title:"하던 거 슬슬 정리해.", body:`${toPrep}분 뒤에 준비 시작해야 ${s.arrive}까지 ${s.to} 도착해.`};
  if(toDep > 5) return {phase:"prep", level:"warn", title:"지금 준비 시작해.", body:`지금 하면 안 뛰어도 돼. ${first.from} ${hhmm(first.board)} 열차${src} 타야 돼.${xf}`};
  if(toDep > 0) return {phase:"shoes", level:"urgent", title:"신발 신어.", body:`${toDep}분 안에 안 나가면 ${first.from} ${hhmm(first.board)} 열차${src} 놓쳐.`};
  const r = simulate(t), sl = slackOf(r, p.target);
  if(atHome) return {phase:"home", level:"late", title:"아직 집이야?", body:`지금 바로 나가. 지금 나가도 ${sl >= 0 ? sl+"분 남아" : -sl+"분 늦어"}.`};
  if(sl >= 0) return {phase:"go", level:"urgent", title:"나갈 시간 지났어.", body:`지금 나가면 ${s.to}에 ${hhmm(r.arrive)} 도착. ${s.arrive}보다 ${sl}분 빨라. 빨리 걸어.`};
  return {phase:"late", level:"late", title:"너 개늦는다.", body:`지금 나가도 ${s.to}에 ${hhmm(r.arrive)} 도착. ${s.arrive}보다 ${-sl}분 늦어.${route.length>1 ? " 환승까지 치면 답 없어." : ""} 늦는다고 지금 연락해.`};
}
function whatIf(off){
  const p = plan(), r = simulate(now() + off*MIN), sl = slackOf(r, p.target);
  const when = off === 0 ? "지금 나가면" : `${off}분 뒤에 나가면`;
  const title = sl >= 5 ? `${dur(sl)} 남아. 괜찮아.` : sl > 0 ? `${sl}분 남아. 빠듯해.` : sl === 0 ? "딱 맞춰 도착. 여유 없어." : `${dur(-sl)} 지각. 그러지 마.`;
  return {level: sl >= 5 ? "" : sl >= 0 ? "warn" : "late", title, body:`${when} ${r.legs[0].from} ${hhmm(r.legs[0].board)} 열차 타고 ${s.to}에 ${hhmm(r.arrive)} 도착. 목표는 ${s.arrive}.`};
}
function current(){ return judge(ready() ? plan() : null, now()); }
function say(m, who="agent"){
  const el = document.createElement("div");
  el.className = `msg ${who} ${m.level||""}`;
  if(who === "me"){ el.textContent = m; }
  else {
    el.innerHTML = `<b></b><span></span><span class="time"></span>`;
    el.querySelector("b").textContent = m.title;
    el.querySelector("span").textContent = m.body;
    el.querySelector(".time").textContent = hhmm(now());
  }
  const feed = $("feed"); feed.append(el);
  while(feed.children.length > 4) feed.firstChild.remove();
}

// ---- 목표 카드 ----
function renderGoal(){
  $("goalHead").innerHTML = s.to && s.arrive ? `${s.arrive}까지 ${s.to}` : `<span class="empty">어디를 몇 시까지 가?</span>`;
  const setV = (el, name) => { el.classList.toggle("empty", !name); el.innerHTML = name ? `${name} ${badges(name)}` : "역 골라"; };
  setV($("fromV"), s.from); setV($("toV"), s.to);
  $("arriveIn").value = s.arrive;
  $("prepV").textContent = `${s.prep}분`;
  if(!route){ $("goalSum").textContent = "출발역·도착역·시간만 정하면 나머지는 내가 계산해."; return; }
  const total = route.reduce((a,l)=>a+legRide(l),0) + (route.length-1)*XFER_WALK + s.walkTo + s.walkFrom;
  $("goalSum").innerHTML = `${route.map(l=>badge(l.l)).join(" → ")} · ${route.length>1 ? `환승 ${route.length-1}번` : "환승 없음"} · 집에서 대략 ${total}분 (대기 빼고)`;
}
function goalChanged(){
  store.set(s); route = findRoute(s.from, s.to); forceSay = !!route && !!s.arrive; sent.clear(); selOffset = 0;
  document.body.classList.toggle("ready", ready());
  tick(); fetchLive();
}
$("arriveIn").addEventListener("change", e=>{ s.arrive = e.target.value; goalChanged(); });
$("prepMinus").addEventListener("click", ()=>{ s.prep = Math.max(0, s.prep-5); goalChanged(); });
$("prepPlus").addEventListener("click", ()=>{ s.prep = Math.min(120, s.prep+5); goalChanged(); });
$("swapBtn").addEventListener("click", ()=>{ [s.from, s.to] = [s.to, s.from]; goalChanged(); });

let pickTarget = "from";
function openPicker(which){
  pickTarget = which;
  $("pickerTitle").textContent = which === "from" ? "어디서 타?" : "어디서 내려?";
  $("pickerSearch").value = ""; renderPicker(); $("picker").showModal(); $("pickerSearch").focus();
}
function renderPicker(){
  const q = $("pickerSearch").value.trim().replace(/역$/,"");
  const all = [...BYNAME.keys()].sort((a,b)=>a.localeCompare(b,"ko"));
  const hits = q ? all.filter(n => n.includes(q)).sort((a,b)=>(b.startsWith(q))-(a.startsWith(q))) : all;
  const recent = q ? [] : s.recent.filter(n => BYNAME.has(n));
  const item = n => `<li><button type="button" data-st="${n}">${n} ${badges(n)}</button></li>`;
  $("pickerList").innerHTML =
    (recent.length ? `<li class="sec">최근</li>${recent.map(item).join("")}<li class="sec">전체 ${all.length}개 역</li>` : "") +
    (hits.length ? hits.slice(0, 200).map(item).join("") : `<li class="sec">그런 역 없어.</li>`);
}
$("pickerSearch").addEventListener("input", renderPicker);
$("pickerList").addEventListener("click", e=>{
  const b = e.target.closest("[data-st]"); if(!b) return;
  const n = b.dataset.st;
  s[pickTarget] = n;
  s.recent = [n, ...s.recent.filter(x=>x!==n)].slice(0,5);
  $("picker").close(); goalChanged();
});
$("pickerClose").addEventListener("click", ()=>$("picker").close());
$("fromBtn").addEventListener("click", ()=>openPicker("from"));
$("toBtn").addEventListener("click", ()=>openPicker("to"));

// ---- 다이얼 ----
const CX=150, CY=150, R=104;
function polar(deg, r=R){ const a=(deg-90)*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)]; }
function arc(d0, d1){
  d0=Math.max(0,d0); d1=Math.min(359.99,d1); if(d1<=d0) return "";
  const [x0,y0]=polar(d0),[x1,y1]=polar(d1);
  return `M${x0} ${y0} A${R} ${R} 0 ${d1-d0>180?1:0} 1 ${x1} ${y1}`;
}
function drawDial(p){
  const t = now();
  const W = Math.max(15, Math.min(180, Math.ceil((p.target - t)/MIN)));
  const deg = ms => (ms - t)/MIN / W * 360;
  $("offset").max = W;
  const r = simulate(t + selOffset*MIN), sl = slackOf(r, p.target);
  const color = sl >= 5 ? "var(--ok)" : sl >= 0 ? "var(--prep)" : "var(--late)";
  const res = sl >= 0 ? `${s.arrive} 목표에 ${dur(sl)} 남음` : `${s.arrive} 목표에 ${dur(-sl)} 지각`;
  const [kx,ky] = polar(selOffset / W * 360);
  const ticks = [0,.25,.5,.75].map(f=>{
    const [x,y]=polar(f*360, R+24);
    return `<text x="${x}" y="${y+4}" text-anchor="middle" class="center-sm">${f ? "+"+Math.round(W*f)+"분" : "지금"}</text>`;
  }).join("");
  $("dial").innerHTML = `
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--soft)" stroke-width="18"/>
    <path d="${arc(0, deg(p.prepStart))}" stroke="var(--free)" stroke-width="18" fill="none"/>
    <path d="${arc(deg(p.prepStart), deg(p.leave))}" stroke="var(--prep)" stroke-width="18" fill="none"/>
    <path d="${arc(deg(p.leave), deg(p.target))}" stroke="var(--travel)" stroke-width="18" fill="none"/>
    ${ticks}
    <circle cx="${kx}" cy="${ky}" r="14" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/>
    <text x="${CX}" y="${CY-20}" text-anchor="middle" class="center-big">${selOffset===0?"지금 나가면":selOffset+"분 뒤에 나가면"}</text>
    <text x="${CX}" y="${CY+4}" text-anchor="middle" class="center-sm">${hhmm(r.legs[0].board)} 열차 · ${hhmm(r.arrive)} 도착</text>
    <text x="${CX}" y="${CY+30}" text-anchor="middle" class="center-res" fill="${color}">${res}</text>`;
}
function setOffsetFromPointer(e){
  const box = $("dial").getBoundingClientRect();
  const x = (e.clientX - box.left)/box.width*300 - CX, y = (e.clientY - box.top)/box.height*300 - CY;
  let deg = Math.atan2(y, x)*180/Math.PI + 90; if(deg<0) deg+=360;
  selOffset = Math.round(deg/360*Number($("offset").max)); $("offset").value = selOffset; drawDial(plan());
}
let dragging=false;
$("dial").addEventListener("pointerdown", e=>{dragging=true; $("dial").setPointerCapture(e.pointerId); setOffsetFromPointer(e);});
$("dial").addEventListener("pointermove", e=>{ if(dragging) setOffsetFromPointer(e); });
$("dial").addEventListener("pointerup", ()=>dragging=false);
$("offset").addEventListener("input", e=>{ selOffset = Number(e.target.value); drawDial(plan()); });

// ---- 경로 ----
function renderRoute(p){
  const past = now() > p.leave, sim = past ? simulate(Math.ceil(now()/MIN)*MIN) : p.sim, sl = slackOf(sim, p.target);
  const li = (t, what, sub, dotc, seg, cls="") =>
    `<li class="${cls}"><span class="t">${t}</span><span class="rail" style="--seg:${seg};--dotc:${dotc}"><span class="dot"></span></span><span class="what">${what}${sub?`<small>${sub}</small>`:""}</span></li>`;
  const rows = [];
  if(!past) rows.push(li(hhmm(p.prepStart), "준비 시작", `${s.prep}분`, "var(--prep)", "var(--prep)"));
  rows.push(li(hhmm(sim.leave), past ? "지금 나가면" : "집에서 나가기", `${sim.legs[0].from}역까지 걸어서 ${s.walkTo}분`, "var(--ink)", "var(--soft)"));
  sim.legs.forEach((l, k) => {
    const c = meta(l.l).c;
    if(k > 0) rows.push(li(hhmm(l.readyAt), `${l.from}에서 ${meta(l.l).name}으로 갈아타기`, `걷는 데 ${XFER_WALK}분 + 기다리는 데 ${mins(l.board - l.readyAt)}분`, "var(--late)", "var(--soft)", "xfer"));
    rows.push(li(hhmm(l.board), `${l.from} ${badge(l.l)} 탑승`, `${l.toward} · ${l.stops}정거장 · 약 ${legRide(l)}분`, c, c));
    rows.push(li(hhmm(l.alight), `${l.to} 하차`, "", c, "var(--soft)"));
  });
  const color = sl >= 0 ? "var(--ok)" : "var(--late)";
  rows.push(li(hhmm(sim.arrive), `<span class="verdict" style="color:${color}">${s.to} 도착 · ${sl >= 0 ? sl+"분 여유" : -sl+"분 지각"}</span>`, `목표 ${s.arrive} · 도보 ${s.walkFrom}분 포함`, color, "transparent"));
  $("route").innerHTML = rows.join("");
  $("routeHint").textContent = past
    ? `원래 ${hhmm(p.leave)}에 나갔어야 했어. 지금 나가면 이렇게 돼.`
    : `${hhmm(sim.leave)}에 나가면 ${s.arrive}까지 맞아. 여유 ${s.buffer}분 포함.`;
}

// ---- 실시간 열차 ----
function upstream(leg, n){
  const out = []; let cur = leg.ids[0], came = leg.next;
  for(let i = 0; i < n; i++){
    const nb = ADJ.get(cur).filter(x => x !== came && lineOf(x) === leg.l);
    if(!nb.length) break;
    came = cur; cur = nb[0]; out.push(cur);
  }
  return out;
}
// 열차 캐릭터: 노선색 몸통 + 창문 얼굴. mood = mine | can | gone
function trainChar(x, y, color, mood, bubble){
  const sc = mood === "mine" ? 1.15 : 1;
  const eyes = mood === "gone"
    ? `<path d="M-8 -3h5M3 -3h5" stroke="#111" stroke-width="2" stroke-linecap="round"/>`
    : `<g class="blink"><circle cx="-5" cy="-3" r="2.2" fill="#111"/><circle cx="5" cy="-3" r="2.2" fill="#111"/></g>`;
  const mouth = mood === "gone" ? `<path d="M-2.5 6h5" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>`
    : `<path d="M-3.5 5Q0 ${mood === "mine" ? 9.5 : 8} 3.5 5" stroke="#111" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const bw = [...bubble].length*10.5 + 16;
  const bfill = mood === "mine" ? "var(--accent)" : mood === "can" ? "var(--card)" : "var(--soft)";
  return `<g transform="translate(${x} ${y-15}) scale(${sc})" opacity="${mood === "gone" ? .5 : 1}">
    <g class="bob${mood === "mine" ? " mine" : ""}">
      <g class="${mood === "mine" ? "wiggle" : ""}">
        <rect x="${-bw/2}" y="-47" width="${bw}" height="21" rx="10.5" fill="${bfill}" stroke="var(--line)" stroke-width="1.8"/>
        <path d="M-5 -26.5 L0 -20 L5 -26.5" fill="${bfill}" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round"/>
        <rect x="-4.2" y="-28.5" width="8.4" height="3" fill="${bfill}"/>
        <text x="0" y="-32.5" text-anchor="middle" font-size="11.5" font-weight="900" fill="${mood === "mine" ? "#111" : "var(--ink)"}">${bubble}</text>
      </g>
      <rect x="-19" y="-13" width="38" height="24" rx="10" fill="${color}" stroke="var(--line)" stroke-width="2"/>
      <rect x="-13" y="-8.5" width="26" height="10" rx="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
      ${eyes}
      <ellipse cx="-14" cy="4" rx="3" ry="2" fill="#ff8ac2"/><ellipse cx="14" cy="4" rx="3" ry="2" fill="#ff8ac2"/>
      ${mouth}
      <circle cx="-10" cy="12" r="3.6" fill="#111"/><circle cx="10" cy="12" r="3.6" fill="#111"/>
    </g>
  </g>`;
}
function renderLive(p){
  const t = now(), past = t > p.leave;
  const leg = (past ? simulate(t) : p.sim).legs[0], m = meta(leg.l);
  const up = upstream(leg, 6), stations = [leg.ids[0], ...up];
  const x1 = 296, gap = (x1 - 28)/6, xOf = k => x1 - k*gap, y = 96;
  let svg = `<line x1="${xOf(stations.length-1)-10}" y1="${y}" x2="${x1+26}" y2="${y}" stroke="${m.c}" stroke-width="9" stroke-linecap="round"/>`;
  svg += `<line x1="${xOf(stations.length-1)-10}" y1="${y}" x2="${x1+26}" y2="${y}" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 9"/>`;
  stations.forEach((id, k) => {
    const n = nameOf(id), x = xOf(k);
    if(k === 0){
      svg += `<circle cx="${x}" cy="${y}" r="9" fill="var(--accent)" stroke="var(--line)" stroke-width="2.5"/>`;
      const short = n.length>5 ? n.slice(0,4)+"…" : n, w = ([...short].length + 3)*12 + 16;
      svg += `<g transform="rotate(-4 ${x} ${y+42})"><rect x="${Math.min(x - w/2, 336 - w)}" y="${y+30}" width="${w}" height="24" rx="8" fill="var(--accent)" stroke="var(--line)" stroke-width="2"/>`;
      svg += `<text x="${Math.min(x, 336 - w/2)}" y="${y+46.5}" text-anchor="middle" font-size="12" font-weight="900" fill="#111">여기! ${short}</text></g>`;
    } else {
      svg += `<circle cx="${x}" cy="${y}" r="5.5" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>`;
      svg += `<text x="${x}" y="${y+22}" text-anchor="middle" font-size="10" fill="var(--muted)">${n.length>5?n.slice(0,4)+"…":n}</text>`;
    }
  });
  const lv = liveTrains(leg);
  const trains = lv.length ? lv : [0,1,2,3].map(j => ({at: modelNext(leg, t) + j*m.h*MIN}));
  const catchFrom = Math.max(t, p.leave) + s.walkTo*MIN;
  let mineShown = false;
  const list = [], chars = [];
  for(const tr of trains.slice(0, 4)){
    const mm = (tr.at - t)/MIN, k = mm / m.ride, mine = !tr.short && tr.at === leg.board, can = !tr.short && tr.at >= catchFrom;
    if(mine) mineShown = k <= stations.length - 0.7;
    if(k <= stations.length - 0.7){
      const mood = mine ? "mine" : can ? "can" : "gone";
      const bubble = mine ? "나 타!" : can ? `${Math.max(1, Math.ceil(mm))}분` : tr.short ? "거기 안 가" : "바이~";
      chars.push([mood, trainChar(xOf(Math.max(0, k)), y, m.c, mood, bubble)]);
    }
    list.push(`<li class="${mine?"mine":can?"":"gone"}"><span class="eta">${mm < 0.5 ? "곧" : Math.ceil(mm)+"분"}</span><span>${hhmm(tr.at)}${tr.dest ? ` · ${tr.dest}행` : ""}${tr.express ? " · 급행" : ""}${tr.last ? " · 막차" : ""}${tr.msg ? ` · ${tr.msg}` : ""}${mine ? " ← 이거 타" : can ? "" : tr.short ? ` (${tr.dest}까지만 가. ${leg.to} 안 가)` : " (못 타)"}</span></li>`);
  }
  // 내 열차가 맨 위에 그려지게
  svg += chars.sort((a,b) => (a[0]==="mine") - (b[0]==="mine")).map(c => c[1]).join("");
  const myWait = Math.ceil((leg.board - t)/MIN);
  svg += `<text x="4" y="172" font-size="12.5" fill="var(--ink)" font-weight="700">${mineShown
    ? "\"나 타!\" 하는 애가 네 열차야. 놓치지 마."
    : `네 열차는 ${hhmm(leg.board)} (${myWait}분 뒤). 아직 저 멀리 있어.`}</text>`;
  $("strip").innerHTML = svg;
  $("trains").innerHTML = list.join("");
  $("liveTitle").innerHTML = `${leg.from} ${badge(leg.l)} ${leg.toward}`;
  $("liveHint").textContent = lv.length ? `실시간 · ${hhmm(live.at)} 기준`
    : isLive() ? (live && live.err ? `실시간 오류: ${live.err} · 배차 간격으로 추정 중` : "지금 이 방향 실시간 열차 정보 없음 · 배차 간격으로 추정 중")
    : "API 키 없어서 배차 간격으로 추정한 위치야.";
}

// ---- 실시간 불러오기 (호출 한도 아끼려고 출발 90분 전부터만 30초마다) ----
async function fetchLive(){
  if(!isLive() || !ready()) return;
  const st = route[0].from;
  try{
    const r = await fetch(`/api/arrivals?station=${encodeURIComponent(st)}`);
    const j = await r.json();
    live = {station:st, rows:j.rows || [], err: j.ok ? null : j.error, at: j.fetchedAt || Date.now()};
  }catch{
    live = {station:st, rows:[], err:"서버 연결 안 됨", at:Date.now()};
  }
  renderSource(); tick();
}
function scheduleLive(){
  let wait = 5*60*1000;
  if(ready() && isLive()){ const p = plan(); if(p.leave - now() < 90*MIN) wait = 30*1000; }
  setTimeout(async ()=>{ await fetchLive(); scheduleLive(); }, wait);
}
function renderSource(){
  const el = $("source"), span = el.querySelector("span");
  el.className = "source";
  if(NET.demo){ span.textContent = STATUS.key ? "실시간 키는 있는데 노선도가 없어 · build_network.py 실행해" : "API 키 없음 · 데모 노선(7개 호선)으로 추정 중"; el.classList.add("err"); return; }
  const n = BYNAME.size;
  if(live && live.err){ el.classList.add("err"); span.textContent = `전체 ${n}개 역 · 실시간 오류: ${live.err}`; return; }
  el.classList.add("live");
  span.textContent = `전체 ${n}개 역 · 서울시 실시간 도착정보 연결됨${live ? ` · ${hhmm(live.at)} 갱신` : ""}`;
}

// ---- 버튼 ----
$("ask").addEventListener("click", ()=>{ say("나 지금 어때?", "me"); say(current()); });
document.querySelectorAll("[data-what]").forEach(b=>b.addEventListener("click", ()=>{
  if(!ready()) return;
  const off = Number(b.dataset.what);
  say(b.textContent, "me"); say(whatIf(off));
  selOffset = off; $("offset").value = off; drawDial(plan());
}));

// ---- 에이전트가 먼저 말 건다 ----
function notify(m){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  try{ new Notification(m.title, {body:m.body, tag:"jansori"}); }catch{}
}
function tick(){
  if(!NET) return;
  const t = now();
  $("clock").textContent = hhmm(t);
  renderGoal();
  const m = current();
  if(ready()){
    const p = plan();
    drawDial(p); renderRoute(p); renderLive(p);
    for(let mark = p.prepStart - 30*MIN; mark < p.leave; mark += s.interval*MIN){
      const id = p.leave+":"+mark;
      if(m.phase === lastPhase && t >= mark && t - mark < 2*MIN && !sent.has(id)){ sent.add(id); say(m); notify(m); }
    }
  }
  if(m.phase !== lastPhase || forceSay){ lastPhase = m.phase; forceSay = false; say(m); if(ready()) notify(m); }
}

// ---- GPS ----
function distM(a,b){
  const toR=x=>x*Math.PI/180, dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(h));
}
function watchHome(){
  if(!s.home || !navigator.geolocation) return;
  $("homePill").textContent = "집 위치 저장됨";
  navigator.geolocation.watchPosition(pos=>{
    const d = distM(s.home, {lat:pos.coords.latitude, lng:pos.coords.longitude});
    atHome = d < 150;
    $("homePill").textContent = atHome ? "지금 집" : `집에서 ${Math.round(d)}m`;
    $("homePill").classList.toggle("on", atHome);
  }, ()=>{ $("homePill").textContent="위치 권한 없음"; }, {maximumAge:60000});
}
$("homeBtn").addEventListener("click", ()=>{
  if(!navigator.geolocation) return alert("위치 못 써.");
  navigator.geolocation.getCurrentPosition(pos=>{
    s.home = {lat:pos.coords.latitude, lng:pos.coords.longitude}; store.set(s); watchHome();
  }, err=>alert("위치 못 가져왔어: "+err.message));
});
$("notifyBtn").addEventListener("click", async ()=>{
  if(!("Notification" in window)) return alert("이 브라우저는 알림 안 돼.");
  const r = await Notification.requestPermission();
  $("notifyBtn").textContent = r==="granted" ? "알림 켜짐" : "알림 꺼짐";
});

// ---- 설정 ----
const form = $("form"), SET_KEYS = ["walkTo","walkFrom","buffer","interval","delay"];
$("openSettings").addEventListener("click", ()=>{ for(const k of SET_KEYS) form.elements[k].value = s[k]; $("settings").showModal(); });
$("sim").addEventListener("input", e=>{ simMin = Number(e.target.value); });
form.addEventListener("submit", ()=>{
  for(const k of SET_KEYS) s[k] = Math.max(0, Number(form.elements[k].value)||0);
  goalChanged();
});

// ---- 시작 ----
(async function init(){
  try{ STATUS = await (await fetch("/api/status")).json(); }catch{ STATUS = {key:false}; }
  let net = null;
  try{ const r = await fetch("/data/network.json"); if(r.ok) net = await r.json(); }catch{}
  prepare(net && Object.keys(net.nodes||{}).length ? net : demoNet());
  if(s.from && !BYNAME.has(s.from)) s.from = "";
  if(s.to && !BYNAME.has(s.to)) s.to = "";
  if(s.home) watchHome();
  renderSource();
  goalChanged();
  setInterval(tick, 5000);
  scheduleLive();
})();
</script>
